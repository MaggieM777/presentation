<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDEAS · AI презентация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, #0b1b3a, #05070f 70%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px;
      height: 600px;
      top: -10%;
      right: -10%;
      background: rgba(0, 180, 255, 0.12);
    }
    body::after {
      width: 500px;
      height: 500px;
      bottom: -10%;
      left: -10%;
      background: rgba(255, 140, 0, 0.10);
    }

    #tsparticles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .navbar {
      position: fixed;
      top: 30px;
      left: 40px;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      cursor: pointer;
    }

    .logo-icon {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: linear-gradient(145deg, #ffb300, #ff7b00);
      box-shadow: 
        0 0 25px rgba(255, 150, 0, 0.5),
        inset 0 2px 6px rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .logo:hover .logo-icon {
      transform: scale(1.05);
      box-shadow: 
        0 0 40px rgba(255, 150, 0, 0.7),
        inset 0 2px 6px rgba(255, 255, 255, 0.3);
    }

    .logo-icon svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .logo-text {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(to bottom, #8ce8ff, #29b6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 15px rgba(41, 182, 255, 0.4));
      transition: filter 0.3s ease;
      line-height: 1;
    }

    .logo:hover .logo-text {
      filter: drop-shadow(0 0 25px rgba(41, 182, 255, 0.6));
    }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3rem;
      margin-top: 100px;
      min-height: 70vh;
      justify-content: center;
    }

    .slide-outer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .slide-wrapper {
      flex: 1;
      overflow: hidden;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
      padding: 2.5rem 3rem;
      min-height: 380px;
      position: relative;
    }

    .nav-arrow {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 50%;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.6rem;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      z-index: 10;
    }

    .nav-arrow:hover {
      background: rgba(76, 201, 255, 0.15);
      border-color: #4cc9ff;
      box-shadow: 0 0 30px rgba(76, 201, 255, 0.15);
      transform: scale(1.05);
    }

    .nav-arrow:active {
      transform: scale(0.92);
    }

    .nav-arrow.left-arrow svg {
      transform: rotate(180deg);
    }

    @media (max-width: 820px) {
      .slide-outer {
        gap: 8px;
      }
      .nav-arrow {
        width: 40px;
        height: 40px;
      }
      .nav-arrow svg {
        width: 18px;
        height: 18px;
      }
    }

    @media (max-width: 600px) {
      .slide-outer {
        gap: 4px;
      }
      .nav-arrow {
        width: 32px;
        height: 32px;
        background: rgba(0, 0, 0, 0.5);
      }
      .nav-arrow svg {
        width: 14px;
        height: 14px;
      }
      .slide-wrapper {
        padding: 1.2rem 1rem;
      }
    }

    .slide-container {
      position: relative;
      overflow: hidden;
      min-height: 300px;
    }

    .slide-track {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    .slide {
      flex: 0 0 100%;
      padding: 1rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 3rem;
      flex-wrap: wrap;
      transition: opacity 0.5s ease, filter 0.5s ease;
    }

    .slide:not(.active) {
      opacity: 0.25;
      filter: blur(2px) brightness(0.6);
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      filter: blur(0) brightness(1);
      pointer-events: auto;
    }

    .slide-content {
      flex: 1 1 400px;
    }

    .slide-image {
      flex: 0 0 330px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      transition: all 0.5s ease;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .slide:not(.active) .slide-image {
      opacity: 0.3;
      transform: scale(0.9);
      filter: blur(2px);
    }

    .slide.active .slide-image {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    .slide-image img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .slide.active .slide-image img:hover {
      transform: scale(1.05);
    }

    .slide-title {
      font-size: clamp(1.8rem, 4.5vw, 3.4rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #4cc9ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.2rem;
      letter-spacing: -0.5px;
      transition: transform 0.5s ease;
    }

    .slide:not(.active) .slide-title {
      transform: scale(0.95);
    }

    .slide-body {
      font-size: 1.1rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.8);
      max-width: 800px;
    }

    .slide-body p {
      margin-bottom: 0.8rem;
    }

    .slide-body ul {
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }

    .slide-body ul li {
      padding: 0.5rem 0 0.5rem 1.8rem;
      position: relative;
      color: rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .slide-body ul li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: #4cc9ff;
      font-size: 0.8rem;
    }

    .slide-body ul li:last-child {
      border-bottom: none;
    }

    .slide-tag {
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(76, 201, 255, 0.10);
      border: 1px solid rgba(76, 201, 255, 0.15);
      color: #4cc9ff;
      margin-top: 1rem;
      margin-right: 0.5rem;
      transition: all 0.4s ease;
    }

    .slide:not(.active) .slide-tag {
      opacity: 0.3;
      transform: scale(0.9);
    }

    .slide-tag.orange {
      background: rgba(255, 140, 0, 0.10);
      border-color: rgba(255, 140, 0, 0.15);
      color: #ff9a3c;
    }

    .slide-tag.green {
      background: rgba(0, 230, 118, 0.10);
      border-color: rgba(0, 230, 118, 0.15);
      color: #69f0ae;
    }

    .slide-tag.purple {
      background: rgba(156, 39, 176, 0.10);
      border-color: rgba(156, 39, 176, 0.15);
      color: #ce93d8;
    }

    .hero-right {
      flex: 0 0 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 280px;
      perspective: 1200px;
    }

    .slide:not(.active) .hero-right {
      opacity: 0.3;
      filter: blur(2px);
      transform: scale(0.9);
      transition: all 0.5s ease;
    }

    .slide.active .hero-right {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }

    .icon-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    .icon-wrapper::after {
      content: '';
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 170, 0, 0.7) 15%,
        rgba(255, 120, 0, 0.25) 45%,
        transparent 70%
      );
      filter: blur(30px);
      z-index: 0;
      animation: pulseCore 3s ease-in-out infinite;
    }

    @keyframes pulseCore {
      0%, 100% { transform: translateX(-50%) scale(0.9); opacity: 0.6; }
      50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      transform-style: preserve-3d;
      border: none;
      animation: pulseRing 4s ease-out infinite;
    }

    .ring:nth-child(1) {
      width: 260px;
      height: 260px;
      animation-delay: 0s;
      box-shadow: 0 0 40px rgba(76, 201, 255, 0.2), inset 0 0 40px rgba(76, 201, 255, 0.1);
      background: radial-gradient(circle, rgba(76, 201, 255, 0.06) 0%, transparent 70%);
    }
    .ring:nth-child(2) {
      width: 320px;
      height: 320px;
      animation-delay: 1.2s;
      box-shadow: 0 0 50px rgba(255, 140, 0, 0.15), inset 0 0 50px rgba(255, 140, 0, 0.08);
      background: radial-gradient(circle, rgba(255, 140, 0, 0.04) 0%, transparent 70%);
    }
    .ring:nth-child(3) {
      width: 380px;
      height: 380px;
      animation-delay: 2.4s;
      box-shadow: 0 0 60px rgba(76, 201, 255, 0.1), inset 0 0 60px rgba(76, 201, 255, 0.05);
      background: radial-gradient(circle, rgba(76, 201, 255, 0.03) 0%, transparent 70%);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(1.2); opacity: 0; }
    }

    .icon-3d {
      position: relative;
      width: 170px;
      height: 170px;
      transform-style: preserve-3d;
      transform: rotateX(-15deg) rotateY(-30deg);
      animation: floatIcon 5s ease-in-out infinite;
      z-index: 2;
    }

    .icon-3d .face {
      position: absolute;
      border-radius: 20px;
      backface-visibility: visible;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .icon-3d .front,
    .icon-3d .back {
      width: 170px;
      height: 170px;
    }

    .icon-3d .front {
      background: radial-gradient(circle at 35% 30%, #ffb84d, #e06600 75%, #b34700);
      box-shadow:
        inset -8px -8px 30px rgba(0,0,0,0.5),
        inset 12px 12px 40px rgba(255,255,255,0.2),
        0 20px 60px rgba(255, 120, 0, 0.4);
      transform: translateZ(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .icon-3d .front .bulb-on-icon {
      width: 90px;
      height: 90px;
      filter: drop-shadow(0 0 30px rgba(255, 200, 100, 0.6));
      animation: glowPulse 2s ease-in-out infinite;
    }

    .icon-3d .back {
      background: radial-gradient(circle at 50% 50%, #8a4a00, #3d1c00 90%);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
      transform: rotateY(180deg) translateZ(20px);
    }

    .icon-3d .left,
    .icon-3d .right {
      width: 40px;
      height: 170px;
      left: 65px;
    }

    .icon-3d .right {
      background: radial-gradient(circle at 30% 50%, #d4880a, #7a3a00 90%);
      box-shadow: 
        inset -5px -5px 20px rgba(0,0,0,0.6),
        inset 8px 8px 20px rgba(255,200,100,0.1);
      transform: rotateY(90deg) translateZ(85px);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
    }

    .icon-3d .left {
      background: radial-gradient(circle at 70% 50%, #a86500, #5a2e00 90%);
      box-shadow: inset -5px -5px 20px rgba(0,0,0,0.5);
      transform: rotateY(-90deg) translateZ(85px);
      border-right: 1px solid rgba(255, 255, 255, 0.03);
    }

    .icon-3d .top,
    .icon-3d .bottom {
      width: 170px;
      height: 40px;
      top: 65px;
    }

    .icon-3d .top {
      background: radial-gradient(circle at 50% 30%, #ffd580, #d4880a 90%);
      box-shadow: 
        inset 0 10px 40px rgba(255,255,255,0.25),
        inset 0 -5px 20px rgba(0,0,0,0.2);
      transform: rotateX(90deg) translateZ(85px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-3d .bottom {
      background: radial-gradient(circle at 50% 70%, #7a3a00, #3d1c00 90%);
      box-shadow: inset 0 -10px 30px rgba(0,0,0,0.6);
      transform: rotateX(-90deg) translateZ(85px);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes floatIcon {
      0% { transform: rotateX(-15deg) rotateY(-30deg) translateY(0); }
      50% { transform: rotateX(-15deg) rotateY(-30deg) translateY(-12px); }
      100% { transform: rotateX(-15deg) rotateY(-30deg) translateY(0); }
    }

    .highlight-box {
      background: rgba(76, 201, 255, 0.06);
      border-left: 3px solid #4cc9ff;
      padding: 1rem 1.5rem;
      border-radius: 0 12px 12px 0;
      margin: 0.8rem 0;
    }

    .highlight-box.orange {
      border-left-color: #ff9a3c;
      background: rgba(255, 140, 0, 0.06);
    }

    .highlight-box.green {
      border-left-color: #69f0ae;
      background: rgba(0, 230, 118, 0.06);
    }

    .highlight-box p {
      margin-bottom: 0 !important;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
    }

    .nav-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .dots {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
      flex: 1;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      flex-shrink: 0;
    }

    .dot.active {
      background: #4cc9ff;
      box-shadow: 0 0 20px rgba(76, 201, 255, 0.4);
      transform: scale(1.2);
    }

    .dot:hover {
      background: rgba(76, 201, 255, 0.4);
    }

    .slide-counter {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 500;
      letter-spacing: 1px;
      padding: 0 0.5rem;
    }

    .footer-text {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 1px;
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      padding-top: 1.8rem;
    }

    .footer-text span {
      color: #4cc9ff;
      opacity: 0.5;
    }

    .ai-literacy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin: 1rem 0;
    }

    .ai-literacy-grid .item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .ai-literacy-grid .item strong {
      color: #4cc9ff;
      display: block;
      font-size: 1.1rem;
      margin-bottom: 0.2rem;
    }

    .vote-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
    }

    .qr-wrapper {
      display: flex;
      gap: 2rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .qr-box {
      background: white;
      padding: 1rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-box #qrcode {
      width: 180px;
      height: 180px;
    }

    .qr-box .qr-label {
      color: #333;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .vote-info {
      flex: 1;
      min-width: 250px;
    }

    .vote-info h3 {
      font-size: 1.3rem;
      color: #4cc9ff;
      margin-bottom: 0.5rem;
    }

    .vote-info p {
      color: rgba(255,255,255,0.7);
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .vote-link {
      display: inline-block;
      background: rgba(76, 201, 255, 0.1);
      border: 1px solid rgba(76, 201, 255, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      color: #4cc9ff;
      font-size: 0.85rem;
      word-break: break-all;
      margin: 0.5rem 0;
      max-width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .vote-link:hover {
      background: rgba(76, 201, 255, 0.2);
    }

    .copy-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.3rem 1rem;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
      margin-left: 0.5rem;
    }

    .copy-btn:hover {
      background: rgba(76, 201, 255, 0.2);
    }

    .vote-steps {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin: 0.5rem 0;
    }

    .vote-step {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      text-align: center;
      min-width: 100px;
    }

    .vote-step .num {
      display: inline-block;
      background: #4cc9ff;
      color: #0b1b3a;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      line-height: 28px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }

    .vote-step p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      margin: 0;
    }

    .chart-container {
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid rgba(255,255,255,0.05);
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .chart-container canvas {
      width: 100% !important;
      height: auto !important;
      max-height: 320px;
    }

    .crypto-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 1rem 0;
    }
    .crypto-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 1rem;
    }
    .crypto-box .encrypted {
      font-family: monospace;
      font-size: 1.1rem;
      color: #ff9a3c;
      background: rgba(0,0,0,0.3);
      padding: 0.5rem;
      border-radius: 8px;
      margin: 0.5rem 0;
      word-break: break-all;
    }
    .crypto-box .decrypted {
      font-family: monospace;

    async function loadChartData() {

    const csvUrl = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;

    const csvText = await response.text();
    const rows = csvText.split('\n').map(row => row.split(','));
    
    // Прескачаме заглавния ред
    const dataRows = rows.slice(1).filter(row => row.length > 1 && row[0] && row[0].trim() !== '');
    
    if (dataRows.length > 0) {
      // === ВЪПРОС 1: Хареса ли Ви IDEAS? (Колона B - индекс 1) ===
      const q1Answers = dataRows.map(row => row[1]?.replace(/"/g, '').trim().toLowerCase() || '');
      const q1Yes = q1Answers.filter(a => a === 'да').length;
      const q1No = q1Answers.filter(a => a === 'не').length;
      
      // === ВЪПРОС 2: Бихте ли препоръчали? (Колона C - индекс 2) ===
      const q2Answers = dataRows.map(row => row[2]?.replace(/"/g, '').trim().toLowerCase() || '');
      const q2Yes = q2Answers.filter(a => a === 'да').length;
      const q2No = q2Answers.filter(a => a === 'не').length;
      
      // === ВЪПРОС 3: Какво бихте добавили? (Колона D - индекс 3) ===
      const q3Answers = dataRows.map(row => row[3]?.replace(/"/g, '').trim() || '');
      const q3WithText = q3Answers.filter(a => a.length > 0).length;
      const q3Empty = q3Answers.filter(a => a.length === 0).length;
      
      // Общ брой отговори
      const totalResponses = dataRows.length;
      
      // Данни за графиката
      chartData.labels = [
        '✅ Хареса (Да)',
        '❌ Не хареса',
        '👍 Препоръчва',
        '👎 Не препоръчва',
        '📝 С коментар',
        '⬜ Без коментар'
      ];
      chartData.values = [
        q1Yes, q1No,
        q2Yes, q2No,
        q3WithText, q3Empty
      ];
      
      // Запазваме данните за статистиките
      window._voteData = {
        totalResponses,
        q1: { yes: q1Yes, no: q1No },
        q2: { yes: q2Yes, no: q2No },
        q3: { withText: q3WithText, empty: q3Empty }
      };
      
    } else {
      // Ако няма данни
      chartData.labels = ['✅ Да', '❌ Не', '📊 Общо'];
      chartData.values = [0, 0, 0];
      window._voteData = {
        totalResponses: 0,
        q1: { yes: 0, no: 0 },
        q2: { yes: 0, no: 0 },
        q3: { withText: 0, empty: 0 }
      };
    }
    updateChart();
    setTimeout(updateStats, 200);
  } catch (error) {
    console.error('Грешка при зареждане на данни:', error);
    chartData.labels = ['✅ Да', '❌ Не', '📊 Общо'];
    chartData.values = [0, 0, 0];
    window._voteData = {
      totalResponses: 0,
      q1: { yes: 0, no: 0 },
      q2: { yes: 0, no: 0 },
      q3: { withText: 0, empty: 0 }
    };
    updateChart();
    setTimeout(updateStats, 200);
  }
}

    function updateChart() {
  const canvas = document.getElementById('resultsChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (chartInstance) chartInstance.destroy();
  
  const colors = [
    'rgba(76, 201, 255, 0.8)',   // Син - Да
    'rgba(255, 99, 132, 0.8)',   // Червен - Не
    'rgba(105, 240, 174, 0.8)',  // Зелен - Препоръчва
    'rgba(255, 99, 132, 0.6)',   // Червен - Не препоръчва
    'rgba(206, 147, 216, 0.8)',  // Лилав - С коментар
    'rgba(200, 200, 200, 0.6)'   // Сив - Без коментар
  ];
  
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: chartData.labels,
      datasets: [{
        label: 'Брой отговори',
        data: chartData.values,
        backgroundColor: colors.slice(0, chartData.labels.length),
        borderColor: 'rgba(255,255,255,0.2)',
        borderWidth: 1,
        borderRadius: 8,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              let value = context.parsed.y || 0;
              let total = window._voteData?.totalResponses || 1;
              let percentage = Math.round((value / total) * 100);
              return `${value} отговора (${percentage}%)`;
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            color: 'rgba(255,255,255,0.5)',
            stepSize: 1
          },
          grid: {
            color: 'rgba(255,255,255,0.05)'
          }
        },
        x: {
          ticks: {
            color: 'rgba(255,255,255,0.6)',
            font: { size: 10 }
          },
          grid: {
            display: false
          }
        }
      }
    }
  });
}

function updateStats() {
  const data = window._voteData;
  if (!data) return;
  
  // Общ брой отговори
  const totalEl = document.getElementById('totalResponses');
  if (totalEl) totalEl.textContent = data.totalResponses;
  
  // Процент харесали IDEAS
  const q1YesEl = document.getElementById('q1YesPercent');
  if (q1YesEl && data.totalResponses > 0) {

    q1YesEl.textContent = pct + '%';
  } else if (q1YesEl) {
    q1YesEl.textContent = '0%';

}
async function loadComments() {
  try {
    const csvUrl = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
    const response = await fetch(csvUrl);
    const csvText = await response.text();
    const rows = csvText.split('\n').map(row => row.split(','));
    const dataRows = rows.slice(1).filter(row => row.length > 3 && row[3] && row[3].trim() !== '');
    
    // Взимаме коментарите от колона D (индекс 3)
    const comments = dataRows
      .map(row => row[3]?.replace(/"/g, '').trim() || '')
      .filter(c => c.length > 0);
    
    const commentsList = document.getElementById('commentsList');
    if (commentsList) {
      if (comments.length > 0) {
        // Показваме максимум 5 коментара
        const limitedComments = comments.slice(0, 5);
        commentsList.innerHTML = limitedComments.map(c => 
          `<div style="padding:0.4rem 0; border-bottom:1px solid rgba(255,255,255,0.05);">💬 ${c}</div>`

          commentsList.innerHTML += `<div style="padding:0.4rem 0; color:rgba(255,255,255,0.3); font-size:0.8rem; text-align:center;">... и още ${comments.length - 5} коментара</div>`;

      } else {
        commentsList.innerHTML = '<p style="text-align:center; color:rgba(255,255,255,0.3); padding:0.5rem;">Все още няма коментари</p>';
      }
    }
  } catch (error) {
    console.error('Грешка при зареждане на коментари:', error);
    const commentsList = document.getElementById('commentsList');
    if (commentsList) {
      commentsList.innerHTML = '<p style="text-align:center; color:rgba(255,255,255,0.3);">Не могат да се заредят коментарите</p>';
    }
  }
}

    function copyLink() {
      const link = VOTE_URL;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(link).then(() => {
          const btn = document.querySelector('.copy-btn');
          if (btn) {
            const originalText = btn.textContent;
            btn.textContent = '✅ Копиран!';
            setTimeout(() => { btn.textContent = originalText; }, 2000);
          }
        });
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = link;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        const btn = document.querySelector('.copy-btn');
        if (btn) {

      return `
        <div class="slide-image">
          <img src="${url}" alt="Technology and AI illustration" loading="lazy" />
        </div>
      `;
    }

    function updateUI(animate = true) {
      const slides = track.querySelectorAll('.slide');
      slides.forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
      counterEl.textContent = `${currentIndex + 1} / ${totalSlides}`;
      if (animate) {
        track.style.transition = 'transform 0.7s cubic-bezier(0.65, 0, 0.35, 1)';
      } else {
        track.style.transition = 'none';
      }
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      if (currentIndex === totalSlides - 1) {
        setTimeout(() => loadChartData(), 300);
      }
    }

    function goTo(index) {
      if (isAnimating) return;
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;
      if (index === currentIndex) return;
      isAnimating = true;
      currentIndex = index;
      updateUI(true);
      if (index === totalSlides - 2) {
        setTimeout(() => generateQR(), 300);
      }
      setTimeout(() => {
        isAnimating = false;
      }, 800);
    }

    function next() { if (!isAnimating) goTo(currentIndex + 1); }
    function prev() { if (!isAnimating) goTo(currentIndex - 1); }

    document.getElementById('nextSlideBtn').addEventListener('click', next);
    document.getElementById('prevSlideBtn').addEventListener('click', prev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });

    setInterval(() => {
  if (currentIndex === totalSlides - 1) {
    loadChartData();
  }
}, 30000);

    tsParticles.load('tsparticles', {
      fpsLimit: 60,
      background: { color: 'transparent' },
      particles: {
        number: { value: 70, density: { enable: true, area: 900 } },
        color: { value: ['#4cc9ff', '#ff9a3c', '#ffffff'] },
        shape: { type: 'circle' },
        opacity: {
          value: 0.5,
          random: true,
          anim: { enable: true, speed: 0.3, opacity_min: 0.1, sync: false }
        },
        size: { value: { min: 1, max: 3 }, random: true },
        links: {
          enable: true,
          distance: 150,
          color: '#4cc9ff',
          opacity: 0.15,
          width: 0.8
        },
        move: {
          enable: true,
          speed: 0.6,
          direction: 'none',
          random: false,
          straight: false,
          outModes: { default: 'out' },
          attract: { enable: false }
        }
      },
      interactivity: {
        detectsOn: 'canvas',
        events: {
          onHover: { enable: true, mode: 'grab' },
          resize: true
        },
        modes: {
          grab: { distance: 180, links: { opacity: 0.3 } }
        }
      },
      detectRetina: true
    });

    renderSlides();
  </script>
</body>
</html>
